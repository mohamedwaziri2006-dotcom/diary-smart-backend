<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — DIARY SMART</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-header">
        <a href="index.html" class="logo" style="display:inline-block;">DIARY <span>SMART</span></a>
        <h3 style="margin-top: 8px;">Reset Password</h3>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 6px;">
          Enter your registered email address and we'll send you a link to reset your password.
        </p>
      </div>

      <form id="forgotPasswordForm">
        
        <div class="form-group" style="margin-top: 20px;">
          <label for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" class="form-input" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="btn btn-primary btn-save" style="width:100%; margin-top: 10px;">
          Send Reset Link
        </button>

      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color: var(--text-muted);">
        Remembered your password? <a href="login.html" style="color:var(--brand-primary); font-weight:700;">Back to Sign in</a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
